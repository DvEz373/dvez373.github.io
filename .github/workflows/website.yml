name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", "cv/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      # The "Download CV" button serves the personal-email CV built from cv/.
      - name: Compile CV
        if: github.event_name != 'pull_request'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: cv
      - name: Add CV to the site
        if: github.event_name != 'pull_request'
        run: cp ../cv/main.pdf public/cv.pdf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Type-check code and content
        run: npm run check
      - name: Build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests (desktop + phone, accessibility)
        run: npm test
      - name: Keep test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: website/playwright-report
          retention-days: 7

      # Deploys the tested build to Vercel as prebuilt static output, so Vercel never rebuilds
      # (it cannot compile the LaTeX CV). Runs only once VERCEL_ENABLED is "true" (see website/README.md).
      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.VERCEL_ENABLED == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # From the repository root: the Vercel project's Root Directory is website/.
        working-directory: .
        run: |
          mkdir -p .vercel/output
          cp -r website/dist .vercel/output/static
          echo '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/.*","status":404,"dest":"/404.html"}]}' > .vercel/output/config.json
          npx --yes vercel@63.1.2 deploy --prebuilt --prod --token "$VERCEL_TOKEN"

  # GitHub Pages cannot be switched off for a *.github.io repository, so dvnezkl.github.io serves
  # forwarding pages instead of an old copy: every address goes to the same path on Vercel.
  pages-redirect:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Write forwarding pages
        run: |
          mkdir site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="noindex">
          <title>Devin Ezekiel Purba · moved</title>
          <link rel="canonical" href="https://dvnezkl.vercel.app/">
          <script>location.replace("https://dvnezkl.vercel.app" + location.pathname + location.search + location.hash);</script>
          <p>This site moved to <a href="https://dvnezkl.vercel.app/">dvnezkl.vercel.app</a>.</p>
          </html>
          HTML
          # Pages serves 404.html for every other path, so deep links forward too.
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
